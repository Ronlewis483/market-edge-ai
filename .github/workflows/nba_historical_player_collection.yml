name: NBA historical player sample

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nba-historical-player-sample
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      NBA_SNAPSHOT_BUCKET: market-edge-data
      NBA_SNAPSHOT_BDL_BUDGET: '40'
      NBA_HISTORY_SAMPLE_GAMES: '10'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collection dependencies
        run: python -m pip install requests==2.32.5
      - name: Collect bounded historical sample
        run: python dual_agent/nba_historical_player_collection.py
