name: NBA historical pregame learning

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['NBA historical player sample']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: nba-historical-pregame-learning
  cancel-in-progress: false

jobs:
  train:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      NBA_SNAPSHOT_BUCKET: market-edge-data
      NBA_AUTOMATIC_RUN: ${{ github.event_name == 'workflow_run' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install storage dependency
        run: python -m pip install requests==2.32.5
      - name: Check whether automatic training is complete
        id: readiness
        run: |
          python - <<'PY'
          import os
          from dual_agent.nba_pregame_snapshots import Client
          report = Client().read('nba/historical_pregame_learning_v1/latest_report.json')
          done = (os.environ.get('NBA_AUTOMATIC_RUN') == 'true' and isinstance(report, dict)
                  and report.get('training_performed') is True
                  and report.get('status') in ('candidate_saved', 'candidate_did_not_pass_validation'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('run_training=' + ('false' if done else 'true') + '\n')
          print('Training already attempted; automatic run skipped.' if done else 'Checking training readiness.')
          PY
      - name: Install training dependencies
        if: ${{ steps.readiness.outputs.run_training == 'true' }}
        run: python -m pip install numpy==2.3.5 pandas scipy==1.17.0 scikit-learn==1.8.0 threadpoolctl==3.6.0
      - name: Reconstruct and train from earlier games
        if: ${{ steps.readiness.outputs.run_training == 'true' }}
        run: python -m dual_agent.nba_historical_pregame_learning
