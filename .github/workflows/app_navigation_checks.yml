name: Prediction app navigation checks

on:
  pull_request:
    paths:
      - 'app.py'
      - 'dual_agent/ncaaf_station.py'
      - 'dual_agent/ncaaf_player_props.py'
      - 'tests/test_app_navigation.py'
      - '.github/workflows/app_navigation_checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install requests==2.32.5 numpy==2.3.5 pandas==2.3.3
      - name: Check page routing and accuracy-report access
        run: python -m unittest discover -s tests -p 'test_app_navigation.py' -v
