name: Ticket builder checks

on:
  pull_request:
    paths:
      - 'app.py'
      - 'dual_agent/ticket_sources.py'
      - 'dual_agent/ticket_value.py'
      - 'dual_agent/preferred_sportsbooks.py'
      - 'dual_agent/sports_player_prop_predictions.py'
      - 'tests/test_ticket_builder.py'
      - '.github/workflows/ticket_builder_checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-builder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install requests==2.32.5 numpy==2.3.5 pandas==2.3.3 scipy==1.17.0
      - name: Verify ticket sources, quote checks and UI controls
        run: python -m unittest discover -s tests -p 'test_ticket_builder.py' -v
