name: NBA context model training

on:
  schedule:
    # Run daily after the overnight NBA games and a scheduled collector run.
    - cron: '7 15 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nba-context-model-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      NBA_SNAPSHOT_BUCKET: market-edge-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install training dependencies
        run: python -m pip install requests==2.32.5 numpy==2.3.5 scipy==1.17.0 scikit-learn==1.8.0 threadpoolctl==3.6.0
      - name: Train or report data readiness
        run: python dual_agent/train_nba_context_neural.py
