name: NFL and MLB connected learning

on:
  schedule:
    - cron: '37 3 * * *'
      timezone: America/Chicago
    - cron: '17 4 * * 2'
      timezone: America/Chicago
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: 'grade saved forecasts or train eligible models'
        options: [grade, train]
        default: train
      sport:
        type: choice
        description: 'Sport to process'
        options: [ALL, NFL, MLB]
        default: ALL

permissions:
  contents: read

concurrency:
  group: nfl-mlb-connected-learning
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      CONNECTED_WINNER_BUCKET: market-edge-data
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MODE: ${{ inputs.mode || (github.event.schedule == '17 4 * * 2' && 'train' || 'grade') }}
      SPORT: ${{ inputs.sport || 'ALL' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install learning dependencies
        run: python -m pip install requests==2.32.5 numpy==2.3.5 pandas==2.3.3 scipy==1.17.0 scikit-learn==1.8.0
      - name: Check required storage secrets
        run: |
          python - <<'PY'
          import os
          missing = [name for name in ['SUPABASE_URL','SUPABASE_KEY'] if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing repository secrets: ' + ', '.join(missing))
          PY
      - name: Grade or train saved NFL and MLB forecasts
        run: python -m dual_agent.sports_connected_winner "$SPORT" --mode "$MODE"
      - name: Save learning report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: nfl-mlb-learning-report
          path: sports_learning_report.json
          if-no-files-found: ignore
