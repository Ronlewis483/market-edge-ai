name: NFL and MLB connected learning
on:
  schedule:
    - cron: '3,18,33,48 * * * *'
    - cron: '43 8 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'cycle checks finals and trains automatically; backfill also reconstructs history'
        type: choice
        options: [cycle, backfill]
        default: backfill
      sport:
        type: choice
        options: [ALL, NFL, MLB]
        default: ALL
permissions:
  contents: read
jobs:
  learn:
    strategy:
      fail-fast: false
      matrix:
        sport: [NFL, MLB]
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.sport == 'ALL' || inputs.sport == 'NFL' || inputs.sport == 'MLB' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: connected-lifecycle-${{ matrix.sport }}
      cancel-in-progress: false
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      CONNECTED_WINNER_BUCKET: market-edge-data
      NBA_SNAPSHOT_BUCKET: market-edge-data
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      REQUESTED_SPORT: ${{ inputs.sport || 'ALL' }}
      MODE: ${{ inputs.mode || (github.event.schedule == '43 8 * * *' && 'backfill' || 'cycle') }}
    steps:
      - uses: actions/checkout@v4
        if: ${{ env.REQUESTED_SPORT == 'ALL' || env.REQUESTED_SPORT == matrix.sport }}
      - uses: actions/setup-python@v5
        if: ${{ env.REQUESTED_SPORT == 'ALL' || env.REQUESTED_SPORT == matrix.sport }}
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: automation-requirements.txt
      - name: Install lifecycle dependencies
        if: ${{ env.REQUESTED_SPORT == 'ALL' || env.REQUESTED_SPORT == matrix.sport }}
        run: python -m pip install -r automation-requirements.txt
      - name: Collect, freeze, grade and automatically train
        if: ${{ env.REQUESTED_SPORT == 'ALL' || env.REQUESTED_SPORT == matrix.sport }}
        env:
          SPORT: ${{ matrix.sport }}
        run: python -m dual_agent.sports_automation "$SPORT" --mode "$MODE"
      - name: Save diagnostic report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: connected-lifecycle-${{ matrix.sport }}-${{ github.run_id }}
          path: |
            sports_automation_report.json
            nfl_historical_learning_report.json
          if-no-files-found: ignore
