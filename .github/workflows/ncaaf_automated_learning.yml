name: NCAAF automated learning

on:
  schedule:
    - cron: '17 3 * * *'
      timezone: America/Chicago
    - cron: '47 4 * * 2'
      timezone: America/Chicago
  workflow_dispatch:
    inputs:
      mode:
        description: 'bootstrap for first setup; collect daily; train weekly'
        type: choice
        options: [bootstrap, collect, train]
        default: bootstrap
      max_weeks:
        description: 'Maximum player-stat week batches to collect (1-100)'
        type: number
        default: 8

permissions:
  contents: read

concurrency:
  group: ncaaf-automated-learning
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      NCAAF_STORAGE_BUCKET: market-edge-data
      NCAAF_ACTIONS_RUN: 'true'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      REQUESTED_MODE: ${{ inputs.mode || (github.event.schedule == '47 4 * * 2' && 'train' || 'collect') }}
      MAX_WEEKS: ${{ inputs.max_weeks || 8 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collection and training dependencies
        run: python -m pip install requests==2.32.5 numpy==2.3.5 pandas==2.3.3 scipy==1.17.0 scikit-learn==1.8.0
      - name: Check required secrets
        run: |
          python - <<'PY'
          import os
          required = ['CFBD_API_KEY', 'SUPABASE_URL', 'SUPABASE_KEY']
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit('Missing repository secrets: ' + ', '.join(missing))
          PY
      - name: Collect, grade and optionally train NCAAF models
        run: python -m dual_agent.ncaaf_learning_job --mode "$REQUESTED_MODE" --max-weeks "$MAX_WEEKS"
      - name: Save workflow report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ncaaf-learning-report
          path: ncaaf_automation_report.json
          if-no-files-found: ignore
