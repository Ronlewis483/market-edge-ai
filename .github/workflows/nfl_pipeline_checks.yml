name: NFL prediction pipeline checks

on:
  pull_request:
    paths:
      - 'app.py'
      - 'dual_agent/nfl_weekly_learning.py'
      - 'dual_agent/sports_connected_winner.py'
      - 'dual_agent/sports_automation.py'
      - 'dual_agent/nfl_connected_engine.py'
      - 'tests/test_nfl_weekly_learning.py'
      - 'dual_agent/nfl_prediction_jobs.py'
      - 'dual_agent/nfl_prediction_pipeline.py'
      - 'dual_agent/nfl_live_context.py'
      - 'dual_agent/nfl_player_history.py'
      - 'dual_agent/nfl_player_props_ui.py'
      - 'dual_agent/nfl_player_props.py'
      - 'dual_agent/preferred_sportsbooks.py'
      - 'dual_agent/prop_platform_selection.py'
      - 'dual_agent/player_prop_regression.py'
      - 'dual_agent/ticket_sources.py'
      - 'tests/test_nfl_prop_end_to_end.py'
      - 'tests/test_ticket_builder.py'
      - 'tests/test_prop_speed.py'
      - 'dual_agent/nfl_player_prop_prediction_pipeline.py'
      - 'dual_agent/game_prediction_addons.py'
      - 'dual_agent/sports_prop_workspace.py'
      - 'tests/test_nfl_prediction_pipeline.py'
      - 'tests/test_nfl_prop_loading.py'
      - 'tests/test_nfl_prop_eligibility.py'
      - '.github/workflows/nfl_pipeline_checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install requests==2.32.5 numpy==2.3.5 pandas==2.3.3 scikit-learn==1.8.0 scipy==1.17.0 'streamlit>=1.38'
      - name: Check NFL schedule, staged results and context concurrency
        run: python -m unittest discover -s tests -p 'test_nfl_*.py' -v
      - name: Check shared prop rendering and ticket consumers
        run: |
          python -m unittest discover -s tests -p 'test_ticket_builder.py' -v
          python -m unittest discover -s tests -p 'test_prop_speed.py' -v
