name: NFL prediction pipeline checks

on:
  pull_request:
    paths:
      - 'app.py'
      - 'dual_agent/nfl_prediction_jobs.py'
      - 'dual_agent/nfl_prediction_pipeline.py'
      - 'dual_agent/nfl_live_context.py'
      - 'dual_agent/sports_prop_workspace.py'
      - 'tests/test_nfl_prediction_pipeline.py'
      - '.github/workflows/nfl_pipeline_checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install requests==2.32.5 numpy==2.3.5 pandas==2.3.3
      - name: Check NFL schedule, staged results and context concurrency
        run: python -m unittest discover -s tests -p 'test_nfl_prediction_pipeline.py' -v
