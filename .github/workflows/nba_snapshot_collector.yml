name: NBA pregame snapshot collector

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nba-pregame-snapshot-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BALLDONTLIE_API_KEY: ${{ secrets.BALLDONTLIE_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      NBA_SNAPSHOT_BUCKET: market-edge-data
      NBA_SNAPSHOT_BDL_BUDGET: '100'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install collector dependency
        run: python -m pip install requests==2.32.5
      - name: Collect and persist pregame snapshots
        run: python dual_agent/nba_pregame_snapshots.py
      - name: Prepare saved NBA training dataset
        run: python dual_agent/nba_training_dataset.py
